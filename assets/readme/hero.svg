<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="mf-title mf-desc">
  <title id="mf-title">MicroFactory</title>
  <desc id="mf-desc">MicroFactory: a miniature 3D factory automation game in your browser. A conveyor line carries iron ore through a furnace, press and assembler into micro-robots, delivered at the export terminal for credits.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    </style>
  </defs>

  <!-- 背景：工业控制台石墨色 -->
  <rect width="1200" height="360" rx="24" fill="#15181d"/>

  <!-- ============ 左侧：标题区 ============ -->
  <g>
    <text class="mono" x="64" y="86" font-size="15" letter-spacing="3" fill="#99a1ad">FACTORY AUTOMATION · IN YOUR BROWSER</text>
    <text class="sans" x="60" y="152" font-size="62" font-weight="700" fill="#eceef2">Micro<tspan fill="#f5a524">Factory</tspan></text>
    <rect x="64" y="172" width="96" height="6" rx="3" fill="#f5a524"/>
    <text class="sans" x="64" y="220" font-size="20" fill="#eceef2">一座浏览器里的微型 3D 自动化工厂</text>
    <text class="sans" x="64" y="250" font-size="17" fill="#99a1ad">把矿石一路加工成微型机器人，沿传送带发货赚钱</text>
    <text class="mono" x="64" y="314" font-size="15" fill="#99a1ad">TypeScript · Three.js · Vite · 38 tests · MIT</text>
  </g>

  <!-- ============ 右侧：流水线示意（游戏原生元素） ============ -->
  <g id="production-line">
    <!-- 传送带段（带游戏同款箭头） -->
    <g fill="#2a313b">
      <rect x="712" y="162" width="42" height="16" rx="8"/>
      <rect x="818" y="162" width="42" height="16" rx="8"/>
      <rect x="924" y="162" width="42" height="16" rx="8"/>
      <rect x="1030" y="162" width="42" height="16" rx="8"/>
    </g>
    <g stroke="#8a94a3" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M721 166 L727 170 L721 174"/>
      <path d="M827 166 L833 170 L827 174"/>
      <path d="M933 166 L939 170 L933 174"/>
      <path d="M1039 166 L1045 170 L1039 174"/>
    </g>
    <!-- 在途物品：矿石 → 锭 → 齿轮+电路板 → 机器人 -->
    <circle cx="744" cy="170" r="5.5" fill="#b0714f"/>
    <circle cx="850" cy="170" r="5.5" fill="#c8cdd8"/>
    <circle cx="944" cy="170" r="5.5" fill="#9aa3b2"/>
    <circle cx="958" cy="170" r="5.5" fill="#58c470"/>
    <circle cx="1052" cy="170" r="6.5" fill="#ffb03b"/>

    <!-- 机器（自绘线性图标，游戏同款风格） -->
    <g stroke="#dfe3ea" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 采矿机：镐 -->
      <g transform="translate(682 170)">
        <path d="M-13 -4 Q0 -19 13 -4"/><path d="M-9 14 L11 -6"/>
      </g>
      <!-- 熔炼炉：炉体 + 烟囱 + 火焰 -->
      <g transform="translate(788 170)">
        <rect x="-12" y="-4" width="24" height="18" rx="2"/>
        <path d="M-7 -4 v-9 h5 v9"/>
        <path d="M-4 9 Q-1 3 0 6 Q1 3 4 9"/>
      </g>
      <!-- 冲压机：活塞 + 砧座 -->
      <g transform="translate(894 170)">
        <path d="M0 -17 v7"/><rect x="-10" y="-10" width="20" height="10" rx="2"/>
        <path d="M-6 0 h12 v5 h-12 z"/>
        <rect x="-13" y="9" width="26" height="5" rx="1.5"/>
      </g>
      <!-- 装配机：芯片 -->
      <g transform="translate(1000 170)">
        <rect x="-10" y="-10" width="20" height="20" rx="3"/>
        <path d="M-5 -10 v-5 M0 -10 v-5 M5 -10 v-5 M-5 10 v5 M0 10 v5 M5 10 v5 M-10 -5 h-5 M-10 0 h-5 M-10 5 h-5 M10 -5 h5 M10 0 h5 M10 5 h5"/>
      </g>
      <!-- 出货终端：琥珀硬币 -->
      <g transform="translate(1106 170)" stroke="#f5a524">
        <circle cx="0" cy="0" r="13"/><circle cx="0" cy="0" r="5" fill="#f5a524"/>
      </g>
    </g>

    <!-- 端口箭头（绿=输入 橙=输出，游戏同款） -->
    <path d="M958 164 L966 170 L958 176 Z" fill="#58c470"/>
    <path d="M1032 164 L1040 170 L1032 176 Z" fill="#f5a524"/>

    <!-- 铜矿支线：从下方矿脉汇入装配机 -->
    <ellipse cx="1000" cy="286" rx="40" ry="11" fill="#23282f"/>
    <circle cx="986" cy="286" r="4" fill="#35a08c"/>
    <circle cx="1000" cy="288" r="4" fill="#35a08c"/>
    <circle cx="1014" cy="285" r="4" fill="#35a08c"/>
    <rect x="994" y="216" width="12" height="60" rx="6" fill="#2a313b"/>
    <path d="M996 262 L1000 256 L1004 262" stroke="#8a94a3" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M993 224 L1000 216 L1007 224" stroke="#58c470" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 站点标签 -->
    <g class="mono" font-size="18" fill="#99a1ad" text-anchor="middle">
      <text x="682" y="126">MINE</text>
      <text x="788" y="126">SMELT</text>
      <text x="894" y="126">PRESS</text>
      <text x="1000" y="126">ASSEMBLE</text>
      <text x="1106" y="126">EXPORT</text>
    </g>
    <text class="mono" x="1106" y="230" font-size="16" fill="#f5a524" text-anchor="middle">+45</text>
  </g>
</svg>
